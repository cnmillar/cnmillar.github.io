<svg width="940" height="320" viewBox="0 0 940 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Keeping subscriber data in sync, instantly</title>
<desc>Illustrative diagram of a webhook-triggered subscription event handler that identifies which publisher site an event belongs to, then routes it to that site's email platform for contact and segment updates, a fulfillment notification for home delivery plans, a real-time team alert for new subscriptions, and a durable event log, with errors caught and flagged separately.</desc>

<defs>
<marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .box { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.5; }
  .teal { fill: #E1F5EE; stroke: #0F6E56; }
  .blue { fill: #E6F1FB; stroke: #185FA5; }
  .purple { fill: #EEEDFE; stroke: #534AB7; }
  .coral { fill: #FAECE7; stroke: #D85A30; stroke-width: 1; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .arr-dash { stroke: #D85A30; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
</style>

<!-- Row 0: Trigger -->
<rect class="box teal" x="320" y="20" width="300" height="56" rx="8"/>
<text class="th" x="470" y="44" text-anchor="middle">Subscription event</text>
<text class="ts" x="470" y="64" text-anchor="middle">New, renewed, or canceled — fires instantly</text>

<line x1="470" y1="76" x2="470" y2="116" class="arr" marker-end="url(#arrow4)"/>

<!-- Row 1: Router -->
<rect class="box purple" x="270" y="116" width="400" height="60" rx="8"/>
<text class="th" x="470" y="140" text-anchor="middle">Cloud Function — identifies the site</text>
<text class="ts" x="470" y="160" text-anchor="middle">Applies that site's list, sender, and plan rules</text>

<!-- Fan-out arrows -->
<line x1="330" y1="176" x2="130" y2="230" class="arr" marker-end="url(#arrow4)"/>
<line x1="420" y1="176" x2="360" y2="230" class="arr" marker-end="url(#arrow4)"/>
<line x1="520" y1="176" x2="590" y2="230" class="arr" marker-end="url(#arrow4)"/>
<line x1="610" y1="176" x2="820" y2="230" class="arr" marker-end="url(#arrow4)"/>

<!-- Row 2: Four destinations -->
<rect class="box" x="30" y="230" width="200" height="70" rx="8"/>
<text class="th" x="130" y="256" text-anchor="middle">Email platform</text>
<text class="ts" x="130" y="276" text-anchor="middle">Add/update contact,</text>
<text class="ts" x="130" y="292" text-anchor="middle">tag by site and plan</text>

<rect class="box" x="260" y="230" width="200" height="70" rx="8"/>
<text class="th" x="360" y="256" text-anchor="middle">Fulfillment notice</text>
<text class="ts" x="360" y="276" text-anchor="middle">Home delivery plans</text>
<text class="ts" x="360" y="292" text-anchor="middle">only, with address</text>

<rect class="box" x="490" y="230" width="200" height="70" rx="8"/>
<text class="th" x="590" y="256" text-anchor="middle">Team Slack alert</text>
<text class="ts" x="590" y="276" text-anchor="middle">New subscriptions,</text>
<text class="ts" x="590" y="292" text-anchor="middle">real-time</text>

<rect class="box blue" x="720" y="230" width="200" height="70" rx="8"/>
<text class="th" x="820" y="256" text-anchor="middle">BigQuery event log</text>
<text class="ts" x="820" y="276" text-anchor="middle">Every change, durable</text>
<text class="ts" x="820" y="292" text-anchor="middle">record for reporting</text>

</svg>
