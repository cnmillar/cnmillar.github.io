<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Multi-publisher data pipeline architecture</title>
<desc>RudderStack connects directly to BigQuery, an engagement platform will land through a custom Cloud Function alongside the email and hosting platforms, and a revenue platform will flow through existing Airbyte and Fivetran connectors. All feed into BigQuery raw datasets, then dbt, then three downstream consumers including Streamlit.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .box { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.5; }
  .planned { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; stroke-dasharray: 4 3; }
  .teal { fill: #E1F5EE; stroke: #0F6E56; }
  .blue { fill: #E6F1FB; stroke: #185FA5; }
  .purple { fill: #EEEDFE; stroke: #534AB7; }
  .coral { fill: #FAECE7; stroke: #D85A30; stroke-width: 1; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>

<!-- Row 0: Planned sources, each routed to its real future landing point -->
<rect class="planned" x="92" y="40" width="115" height="56" rx="8"/>
<text class="th" x="150" y="64" text-anchor="middle">Engagement tool</text>
<text class="ts" x="150" y="84" text-anchor="middle">Cloud Function</text>

<rect class="planned" x="212" y="40" width="115" height="56" rx="8"/>
<text class="th" x="270" y="64" text-anchor="middle">RudderStack</text>
<text class="ts" x="270" y="84" text-anchor="middle">Direct to BigQuery</text>

<rect class="planned" x="342" y="40" width="115" height="56" rx="8"/>
<text class="th" x="400" y="64" text-anchor="middle">Revenue platform</text>
<text class="ts" x="400" y="84" text-anchor="middle">Payments</text>

<!-- Engagement tool -> email/hosting Cloud Function tier -->
<line x1="150" y1="96" x2="150" y2="136" class="arr" marker-end="url(#arrow)"/>
<!-- RudderStack -> straight to BigQuery, bypassing the ingestion tier -->
<line x1="270" y1="96" x2="270" y2="232" class="arr" marker-end="url(#arrow)"/>
<!-- Revenue platform -> Airbyte + Fivetran tier -->
<line x1="400" y1="96" x2="400" y2="136" class="arr" marker-end="url(#arrow)"/>

<!-- Row 1: Existing ingestion -->
<rect class="box teal" x="40" y="136" width="220" height="56" rx="8"/>
<text class="th" x="150" y="160" text-anchor="middle">Email + hosting platforms</text>
<text class="ts" x="150" y="180" text-anchor="middle">Cloud Functions, ~7am ET</text>

<rect class="box teal" x="280" y="136" width="240" height="56" rx="8"/>
<text class="th" x="400" y="160" text-anchor="middle">Airbyte + Fivetran</text>
<text class="ts" x="400" y="180" text-anchor="middle">HubSpot, Chargebee, payments</text>

<line x1="150" y1="192" x2="150" y2="232" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="192" x2="400" y2="232" class="arr" marker-end="url(#arrow)"/>

<!-- Row 2: BigQuery raw layer -->
<rect class="box blue" x="40" y="232" width="480" height="56" rx="8"/>
<text class="th" x="280" y="256" text-anchor="middle">BigQuery raw datasets</text>
<text class="ts" x="280" y="276" text-anchor="middle">One landing zone per source</text>

<line x1="280" y1="288" x2="280" y2="328" class="arr" marker-end="url(#arrow)"/>

<!-- Row 3: dbt transformation layer -->
<rect class="box purple" x="40" y="328" width="480" height="56" rx="8"/>
<text class="th" x="280" y="352" text-anchor="middle">dbt</text>
<text class="ts" x="280" y="372" text-anchor="middle">Staging, intermediate, marts — daily</text>

<path d="M280 384V400" class="arr"/>
<path d="M280 400H114V424" class="arr" marker-end="url(#arrow)"/>
<path d="M280 400V424" class="arr" marker-end="url(#arrow)"/>
<path d="M280 400H444V424" class="arr" marker-end="url(#arrow)"/>

<!-- Row 4: Downstream consumers -->
<rect class="box" x="40" y="424" width="149" height="56" rx="8"/>
<text class="th" x="114" y="448" text-anchor="middle">HubSpot sync-back</text>
<text class="ts" x="114" y="468" text-anchor="middle">Weekly</text>

<rect class="coral" x="205" y="424" width="149" height="56" rx="8"/>
<text class="th" x="279" y="448" text-anchor="middle">Limit alerts</text>
<text class="ts" x="279" y="468" text-anchor="middle">Daily · new</text>

<rect class="box" x="370" y="424" width="149" height="56" rx="8"/>
<text class="th" x="444" y="448" text-anchor="middle">Streamlit</text>
<text class="ts" x="444" y="468" text-anchor="middle">CS + leadership</text>

</svg>
