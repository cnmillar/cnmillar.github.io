<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Getting warehouse data into the hands that need it</title>
<desc>Illustrative diagram showing BigQuery raw and transformed tables feeding dbt models, a scheduled reverse-ETL job writing outcome properties back into a HubSpot company record, and a sample Publisher Outcomes panel showing the resulting fields.</desc>

<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .box { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.5; }
  .blue { fill: #E6F1FB; stroke: #185FA5; }
  .purple { fill: #EEEDFE; stroke: #534AB7; }
  .teal { fill: #E1F5EE; stroke: #0F6E56; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .panel-title { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; fill: #0F6E56; }
  .field-label { font-size: 12px; fill: #5F5E5A; }
  .field-value { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
  .contact-name { font-size: 16px; font-weight: 700; fill: #2C2C2A; }
</style>

<!-- Row 0: BigQuery -->
<rect class="box blue" x="80" y="30" width="340" height="56" rx="8"/>
<text class="th" x="250" y="54" text-anchor="middle">BigQuery raw + marts</text>
<text class="ts" x="250" y="74" text-anchor="middle">Publisher health metrics</text>

<line x1="250" y1="86" x2="250" y2="126" class="arr" marker-end="url(#arrow2)"/>

<!-- Row 1: dbt -->
<rect class="box purple" x="80" y="126" width="340" height="56" rx="8"/>
<text class="th" x="250" y="150" text-anchor="middle">dbt models</text>
<text class="ts" x="250" y="170" text-anchor="middle">Aggregates to one row per publisher</text>

<line x1="250" y1="182" x2="250" y2="222" class="arr" marker-end="url(#arrow2)"/>

<!-- Row 2: Reverse ETL job -->
<rect class="box teal" x="80" y="222" width="340" height="56" rx="8"/>
<text class="th" x="250" y="246" text-anchor="middle">Scheduled sync job</text>
<text class="ts" x="250" y="266" text-anchor="middle">Cloud Function, runs nightly</text>

<line x1="250" y1="278" x2="250" y2="318" class="arr" marker-end="url(#arrow2)"/>

<!-- Row 3: HubSpot company record -->
<rect class="box" x="80" y="318" width="340" height="56" rx="8"/>
<text class="th" x="250" y="342" text-anchor="middle">HubSpot company record</text>
<text class="ts" x="250" y="362" text-anchor="middle">Outcome properties, one per publisher</text>

<line x1="420" y1="346" x2="480" y2="346" class="arr" marker-end="url(#arrow2)"/>

<!-- Sample HubSpot company record: Publisher Outcomes panel -->
<rect x="500" y="60" width="360" height="500" rx="10" fill="#FAFAF8" stroke="#E3E1D9" stroke-width="1"/>
<text class="panel-title" x="524" y="90">▾ PUBLISHER OUTCOMES</text>
<text class="contact-name" x="524" y="122">Ridgeline Post</text>

<line x1="524" y1="140" x2="836" y2="140" stroke="#E3E1D9" stroke-width="1"/>

<text class="field-label" x="524" y="172">Revenue Status</text>
<text class="field-value" x="524" y="194">Stable</text>

<text class="field-label" x="712" y="172">Email Engagement</text>
<text class="field-value" x="712" y="194">Strong</text>

<text class="field-label" x="524" y="230">List Growth Status</text>
<text class="field-value" x="524" y="252">Growing</text>

<text class="field-label" x="712" y="230">Traffic Status</text>
<text class="field-value" x="712" y="252">Steady</text>

<text class="field-label" x="524" y="288">Revenue 30 Day</text>
<text class="field-value" x="524" y="310">58.0</text>

<text class="field-label" x="712" y="288">Email List Size</text>
<text class="field-value" x="712" y="310">4,210</text>

<text class="field-label" x="524" y="346">Avg Open Rate (%)</text>
<text class="field-value" x="524" y="368">41.0</text>

<text class="field-label" x="712" y="346">Daily Avg Visits</text>
<text class="field-value" x="712" y="368">118</text>

<line x1="524" y1="392" x2="836" y2="392" stroke="#E3E1D9" stroke-width="1"/>

<text class="field-label" x="524" y="422">Outcomes Last Updated</text>
<text class="field-value" x="524" y="444">Nightly, 6:00 AM</text>

<text class="field-label" x="524" y="480">Updated By</text>
<text class="field-value" x="524" y="502">Sync job</text>

</svg>
