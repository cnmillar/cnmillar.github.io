<svg width="1160" height="1160" viewBox="0 0 1160 1160" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Daily performance report mockup</title>
<desc>Illustrative daily performance report for a fictional local news publisher, showing story-level traffic, newsletter engagement, and subscriber growth metrics.</desc>

<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #F2C94C; }
  .h1 { font-size: 34px; fill: #FFFFFF; }
  .summary { font-size: 17px; fill: #384454; }
  .section-label { font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #1F2933; }
  .story-title { font-size: 21px; fill: #1F2933; }
  .story-meta { font-size: 14px; fill: #6B7280; }
  .link { fill: #2F6FED; }
  .stat-label { font-size: 15px; fill: #6B7280; }
  .stat-value { font-size: 30px; font-weight: 700; fill: #1F2933; }
  .rule { stroke: #1F2933; stroke-width: 3; }
  .hair { stroke: #E5E7EB; stroke-width: 1; }
</style>

<!-- Header -->
<rect x="0" y="0" width="1160" height="200" fill="#0B1F3A"/>
<text class="eyebrow" x="76" y="66">DAILY PERFORMANCE REPORT</text>
<text class="h1 serif" x="76" y="128">The Ridgeline Post — Sample Date</text>

<!-- Summary callout -->
<rect x="76" y="228" width="8" height="150" fill="#F2C94C"/>
<rect x="84" y="228" width="1004" height="150" fill="#F7F8F9"/>
<text class="summary" x="116" y="270">Today's top story received 142 views, well below the 30-day median of 410, consistent</text>
<text class="summary" x="116" y="298">with typically lower weekend traffic. Newsletter engagement was steady, with 41% open</text>
<text class="summary" x="116" y="326">and 6.1% click rates compared to averages of 39.5% and 5.8%. New paid subscribers were</text>
<text class="summary" x="116" y="354">3, in line with the daily average of 2.5.</text>

<line class="rule" x1="76" y1="410" x2="1088" y2="410"/>

<!-- Top Stories -->
<rect x="76" y="440" width="8" height="20" fill="#27AE60"/>
<text class="section-label" x="100" y="456">TOP STORIES</text>

<text class="story-title serif" x="76" y="504">1. Weekend roundup: what to know this week</text>
<text class="story-meta" x="76" y="530">142 views  ·  Direct (58), Not Set (41), <tspan class="link">Google (12)</tspan></text>
<line class="hair" x1="76" y1="556" x2="1088" y2="556"/>

<text class="story-title serif" x="76" y="596">2. Local council approves new park funding</text>
<text class="story-meta" x="76" y="622">98 views  ·  <tspan class="link">Facebook (30)</tspan>, <tspan class="link">Google (22)</tspan>, <tspan class="link">localnews.example (15)</tspan></text>
<line class="hair" x1="76" y1="648" x2="1088" y2="648"/>

<text class="story-title serif" x="76" y="688">3. Downtown farmers market returns this weekend</text>
<text class="story-meta" x="76" y="714">76 views  ·  <tspan class="link">localnews.example (44)</tspan>, Direct (10), Not Set (8)</text>

<line class="rule" x1="76" y1="762" x2="1088" y2="762"/>

<!-- Latest Newsletter -->
<rect x="76" y="792" width="8" height="20" fill="#8B7FD6"/>
<text class="section-label" x="100" y="808">LATEST NEWSLETTER — NO RECENT CAMPAIGNS</text>

<text class="stat-label" x="76" y="856">Total Sent</text>
<text class="stat-value" x="76" y="892">1,200</text>

<text class="stat-label" x="426" y="856">Open Rate</text>
<text class="stat-value" x="426" y="892">41%</text>

<text class="stat-label" x="776" y="856">Click Rate</text>
<text class="stat-value" x="776" y="892">6.1%</text>

<line class="hair" x1="76" y1="922" x2="1088" y2="922"/>

<text class="stat-label" x="76" y="956">7-Day Avg Open</text>
<text class="stat-value" x="76" y="992">39.5%</text>

<text class="stat-label" x="426" y="956">7-Day Avg Click</text>
<text class="stat-value" x="426" y="992">5.8%</text>

<line class="rule" x1="76" y1="1032" x2="1088" y2="1032"/>

<!-- Newsletter Growth -->
<rect x="76" y="1062" width="8" height="20" fill="#E85D4E"/>
<text class="section-label" x="100" y="1078">NEWSLETTER GROWTH</text>

<text class="stat-label" x="76" y="1112">Total Email Subscribers</text>
<text class="stat-value" x="76" y="1148">4,210</text>

</svg>
