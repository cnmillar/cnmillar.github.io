<svg width="900" height="680" viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Publisher churn model pipeline</title>
<desc>Illustrative diagram showing engagement, newsletter, and subscription signals feeding a feature engineering step, a classification model, and a churn risk score that routes to a CS outreach queue and a health scoring dashboard, alongside a sample ranked risk output.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .box { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.5; }
  .teal { fill: #E1F5EE; stroke: #0F6E56; }
  .blue { fill: #E6F1FB; stroke: #185FA5; }
  .purple { fill: #EEEDFE; stroke: #534AB7; }
  .coral { fill: #FAECE7; stroke: #D85A30; stroke-width: 1; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .panel-title { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; fill: #5F5E5A; }
  .pub-name { font-size: 13px; fill: #2C2C2A; }
  .score { font-size: 12px; fill: #5F5E5A; }
</style>

<!-- Row 0: Input signals -->
<rect class="box teal" x="30" y="30" width="180" height="56" rx="8"/>
<text class="th" x="120" y="54" text-anchor="middle">Engagement signals</text>
<text class="ts" x="120" y="74" text-anchor="middle">Logins, page views</text>

<rect class="box teal" x="230" y="30" width="180" height="56" rx="8"/>
<text class="th" x="320" y="54" text-anchor="middle">Newsletter activity</text>
<text class="ts" x="320" y="74" text-anchor="middle">Opens, clicks, sends</text>

<rect class="box teal" x="430" y="30" width="180" height="56" rx="8"/>
<text class="th" x="520" y="54" text-anchor="middle">Subscription events</text>
<text class="ts" x="520" y="74" text-anchor="middle">Plan changes, payments</text>

<line x1="120" y1="86" x2="270" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="86" x2="320" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="86" x2="370" y2="140" class="arr" marker-end="url(#arrow)"/>

<!-- Row 1: Feature engineering -->
<rect class="box blue" x="150" y="140" width="340" height="56" rx="8"/>
<text class="th" x="320" y="164" text-anchor="middle">Feature engineering</text>
<text class="ts" x="320" y="184" text-anchor="middle">Rolling windows, trend deltas, recency</text>

<line x1="320" y1="196" x2="320" y2="236" class="arr" marker-end="url(#arrow)"/>

<!-- Row 2: Model -->
<rect class="box purple" x="150" y="236" width="340" height="56" rx="8"/>
<text class="th" x="320" y="260" text-anchor="middle">Classification model</text>
<text class="ts" x="320" y="280" text-anchor="middle">Random forest, retrained monthly</text>

<line x1="320" y1="292" x2="320" y2="332" class="arr" marker-end="url(#arrow)"/>

<!-- Row 3: Risk score -->
<rect class="box coral" x="200" y="332" width="240" height="56" rx="8"/>
<text class="th" x="320" y="356" text-anchor="middle">Churn risk score</text>
<text class="ts" x="320" y="376" text-anchor="middle">0–100, refreshed weekly</text>

<line x1="270" y1="388" x2="150" y2="428" class="arr" marker-end="url(#arrow)"/>
<line x1="370" y1="388" x2="490" y2="428" class="arr" marker-end="url(#arrow)"/>

<!-- Row 4: Downstream actions -->
<rect class="box" x="30" y="428" width="240" height="56" rx="8"/>
<text class="th" x="150" y="452" text-anchor="middle">CS outreach queue</text>
<text class="ts" x="150" y="472" text-anchor="middle">Publishers above threshold</text>

<rect class="box" x="370" y="428" width="240" height="56" rx="8"/>
<text class="th" x="490" y="452" text-anchor="middle">Health scoring dashboard</text>
<text class="ts" x="490" y="472" text-anchor="middle">Team-wide visibility</text>

<!-- Sample output panel -->
<rect x="30" y="524" width="580" height="130" rx="10" fill="#FAFAF8" stroke="#E3E1D9" stroke-width="1"/>
<text class="panel-title" x="52" y="552">SAMPLE OUTPUT — RANKED BY RISK</text>

<text class="pub-name" x="52" y="580">Ridgeline Post</text>
<rect x="220" y="568" width="300" height="14" rx="4" fill="#EEEDE6"/>
<rect x="220" y="568" width="255" height="14" rx="4" fill="#D85A30"/>
<text class="score" x="530" y="580">85</text>

<text class="pub-name" x="52" y="604">Harborline Ledger</text>
<rect x="220" y="592" width="300" height="14" rx="4" fill="#EEEDE6"/>
<rect x="220" y="592" width="171" height="14" rx="4" fill="#E0A030"/>
<text class="score" x="530" y="604">57</text>

<text class="pub-name" x="52" y="628">Tallgrass Wire</text>
<rect x="220" y="616" width="300" height="14" rx="4" fill="#EEEDE6"/>
<rect x="220" y="616" width="72" height="14" rx="4" fill="#0F6E56"/>
<text class="score" x="530" y="628">24</text>

</svg>
